# mship-workspace — coordination workspace for the Mothership family.
# Members live as gitignored subdirectories (cloned into the workspace). On a
# machine with an existing `mothership` checkout, `mothership/` may be a symlink
# to it. `mship` coordinates the members from here.
workspace: mship-workspace

# Base prefix for resolving each member's clone URL when its `url` is omitted
# (member name appended). Lets `mship bootstrap` materialize this workspace from
# a fresh clone — e.g. `mothership` -> https://github.com/atomikpanda/mothership.
# A member on a different host/owner can override with its own `url`.
default_remote: https://github.com/atomikpanda

repos:
  mothership:
    path: mothership
    type: service
    base_branch: main
    expected_branch: main
  ground-control:
    path: ground-control
    type: service
    base_branch: main
    expected_branch: main
    # Source the local Android toolchain (JDK17 + SDK) before any `task` target
    # so `mship test`/`build`/`capture` find java/adb without the dev sourcing it
    # by hand. Guarded: a no-op when the file is absent (e.g. cloud/CI), where the
    # ambient env is expected to provide the toolchain instead.
    env_runner: "sh -c '[ -f \"$HOME/toolchains/android-env.sh\" ] && . \"$HOME/toolchains/android-env.sh\"; exec \"$@\"' _"
    # Platforms `mship capture` can target (requires --platform since >1).
    capture:
      platforms: [android, ios]
